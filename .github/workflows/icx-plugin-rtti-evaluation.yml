name: ICX plugin RTTI and wrapper evaluation
on:
  push:
    branches: [icx-plugin-rtti-evaluation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROOT: /tmp/icx-rtti
      ICX: /opt/intel/oneapi/compiler/2026.1/bin/icx
      ICPX: /opt/intel/oneapi/compiler/2026.1/bin/icpx
      LLVM: /usr/lib/llvm-22
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          repository: abicheck/abicheck
          ref: b9c9c33fdd35bbcf61bf43aeee0e5a87bd46d93d
          path: abicheck
          persist-credentials: false

      - name: Install compilers
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$ROOT"; mkdir -p "$ROOT/logs" "$ROOT/results"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gnupg ninja-build python3-venv wget binutils
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneapi.list >/dev/null
          key="$ROOT/llvm.key"; wget -qO "$key" https://apt.llvm.org/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons --with-fingerprint "$key" | awk -F: '/^fpr:/{print $10;exit}')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$key" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp-2026.1 clang-22 llvm-22-dev libclang-22-dev
          "$ICPX" --version

      - name: Build and test
        shell: bash
        run: |
          set +e
          export PATH="/opt/intel/oneapi/compiler/2026.1/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/intel/oneapi/compiler/2026.1/lib:${LD_LIBRARY_PATH:-}"
          frontend=/opt/intel/oneapi/compiler/2026.1/bin/compiler/clang
          {
            "$ICPX" -dM -E -x c++ /dev/null | grep -E '(__INTEL_LLVM_COMPILER|__clang_(major|minor|patchlevel)__|__GXX_RTTI)' | sort
            echo 'ICX PluginASTAction exports:'
            nm -D "$frontend" | c++filt | grep -F 'clang::PluginASTAction' || true
          } | tee "$ROOT/logs/symbols.log"

          build() {
            label=$1; cc=$2; cxx=$3; flags=$4
            cmake -S "$GITHUB_WORKSPACE/abicheck/contrib/abicheck-clang-plugin" -B "$ROOT/build-$label" -G Ninja \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_CXX_COMPILER="$cxx" \
              -DLLVM_DIR="$LLVM/lib/cmake/llvm" -DClang_DIR="$LLVM/lib/cmake/clang" \
              -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_BUILD_TYPE=Release >"$ROOT/logs/build-$label.log" 2>&1
            crc=$?; brc=125
            if [[ $crc = 0 ]]; then cmake --build "$ROOT/build-$label" -v >>"$ROOT/logs/build-$label.log" 2>&1; brc=$?; fi
            printf 'configure=%s\nbuild=%s\n' "$crc" "$brc" >"$ROOT/results/build-$label.status"
            cat "$ROOT/logs/build-$label.log"
            nm -D --undefined-only "$ROOT/build-$label/libabicheck-facts.so" 2>/dev/null | c++filt | grep -F 'clang::PluginASTAction' || true
          }
          build clang-no-rtti /usr/bin/clang-22 /usr/bin/clang++-22 -fno-rtti
          build icpx-no-rtti "$ICX" "$ICPX" -fno-rtti

          mkdir -p "$ROOT/fixture/include"
          cat >"$ROOT/fixture/include/api.hpp" <<'EOF'
          #pragma once
          namespace sample { struct Widget { int value; }; inline int get(Widget w) { return w.value; } }
          EOF
          cat >"$ROOT/fixture/use.cpp" <<'EOF'
          #include "api.hpp"
          int use_widget(sample::Widget w) { return sample::get(w); }
          EOF

          smoke() {
            label=$1; compiler=$2; plugin=$3; out="$ROOT/smoke-$label"
            rm -rf "$out"
            "$compiler" -std=c++17 -I"$ROOT/fixture/include" -fplugin="$plugin" \
              -Xclang -plugin-arg-abicheck-facts -Xclang "out=$out" \
              -Xclang -plugin-arg-abicheck-facts -Xclang "public-roots=$ROOT/fixture/include" \
              -c "$ROOT/fixture/use.cpp" -o "$ROOT/$label.o" >"$ROOT/logs/smoke-$label.log" 2>&1
            rc=$?; echo "rc=$rc" >"$ROOT/results/smoke-$label.status"
            echo "=== smoke $label rc=$rc ==="; cat "$ROOT/logs/smoke-$label.log"; find "$out" -type f -maxdepth 3 -print 2>/dev/null || true
          }
          smoke clang-clang-no-rtti /usr/bin/clang++-22 "$ROOT/build-clang-no-rtti/libabicheck-facts.so"
          smoke icpx-clang-no-rtti "$ICPX" "$ROOT/build-clang-no-rtti/libabicheck-facts.so"
          smoke icpx-icpx-no-rtti "$ICPX" "$ROOT/build-icpx-no-rtti/libabicheck-facts.so"

          python3 -m venv "$ROOT/venv"; source "$ROOT/venv/bin/activate"
          pip install -q -e "$GITHUB_WORKSPACE/abicheck"
          export ABICHECK_INPUTS_DIR="$ROOT/wrapper" ABICHECK_CC_EXTRACTOR=clang ABICHECK_CC_HEADERS="$ROOT/fixture/include" ABICHECK_CC_LIBRARY=icx-wrapper
          abicheck-cc "$ICPX" -std=c++17 -I"$ROOT/fixture/include" -c "$ROOT/fixture/use.cpp" -o "$ROOT/wrapper.o" >"$ROOT/logs/wrapper.log" 2>&1
          wrc=$?; count=$(find "$ROOT/wrapper/source_facts" -name '*.jsonl' 2>/dev/null | wc -l)
          printf 'rc=%s\nfact_files=%s\n' "$wrc" "$count" >"$ROOT/results/wrapper.status"
          cat "$ROOT/logs/wrapper.log"; find "$ROOT/wrapper" -type f -maxdepth 3 -print 2>/dev/null || true

          for variant in clang-no-rtti icpx-no-rtti; do
            src="$ROOT/results/smoke-icpx-$variant.status"
            src_rc=$(sed -n 's/^rc=//p' "$src" 2>/dev/null)
            rc=125
            if [[ "$src_rc" = 0 ]]; then
              python "$GITHUB_WORKSPACE/abicheck/contrib/abicheck-clang-plugin/tests/conformance.py" \
                --plugin "$ROOT/build-$variant/libabicheck-facts.so" --clangxx "$ICPX" \
                --work "$ROOT/conf-$variant" --keep >"$ROOT/logs/conf-$variant.log" 2>&1
              rc=$?
            else echo "skipped smoke=$src_rc" >"$ROOT/logs/conf-$variant.log"; fi
            echo "rc=$rc" >"$ROOT/results/conf-$variant.status"
            echo "=== conformance $variant rc=$rc ==="; cat "$ROOT/logs/conf-$variant.log"
          done
          exit 0

      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo '# ICX no-RTTI and wrapper results'; echo '```'; for f in "$ROOT"/results/*; do echo "[$(basename "$f")]"; cat "$f"; done; echo '```'; } | tee "$ROOT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icx-plugin-rtti-wrapper
          path: /tmp/icx-rtti
          retention-days: 7
