# The single reviewed ABICheck scanner pin.
#
# Every workflow that installs the scanner, and every reusable-workflow
# reference into abicheck/abicheck, must resolve to `sha` below.  GitHub does
# not allow `uses:` refs to be interpolated from a file, so the reusable
# workflow references are still written out literally in the workflow YAML --
# tests/test_abicheck_pin.py fails if any of them drifts from this value, so
# the literal duplication cannot silently diverge from the reviewed pin.
#
# Bumping the pin is not an edit to this file alone.  The flow is:
#
#     candidate upstream SHA
#         -> canary certification (.github/workflows/canary.yml)
#         -> integration-lab PR that moves `sha` here and every literal
#            `uses:`/pip ref with it
#         -> all scenarios + real accepted-main baseline comparison
#         -> reviewed merge
#
# `candidate_sha` is the next SHA the canary is expected to certify.  It is
# recorded here so the certification target is reviewed in the same place as
# the pin it will replace; nothing installs it until it becomes `sha`.
repository: abicheck/abicheck

# Scanner used by the native project path (.abicheck.yml, project-shadow.yml,
# project-baseline.yml, depth-scenarios.yml).
sha: 42da2d2f947d9eaa42e7d5f334bd2098bb5f08e7

# Baseline-generation this pin's fact extraction corresponds to.  Bumping
# `sha` across a fact/normalization/schema change must bump this too, which
# re-namespaces every accepted-main cache key (see project-baseline.yml).
generation: 1

# Scanner used by the older single-target Bazel gate/scenario suite
# (abi-scan.yml, baseline.yml, scenarios.yml, integration-shadow.yml,
# profile-baseline.yml, release.yml, performance.yml).  These workflows
# predate the native project contract and are migrating onto `sha` one at a
# time; until then this pin is reviewed here rather than being an
# unexplained literal in every workflow file.
#
# 2026-09-29 bump (b299afdc -> 5ba6a5c8, abicheck/main HEAD): upstream
# ADR-068 hard-removed the `scan` CLI command and the Action's `mode: scan`
# (abicheck 85c319c4, 2026-09-11, no deprecation window), and CLI cleanup
# removed compare's `--format`/`--lang`/`--ast-frontend`/
# `--require-complete-analysis` flags (now `-o FORMAT=PATH` and
# `.abicheck.yml` `compile:`/`assurance:` keys).  Every path that ran under
# this pin has been migrated to the replacement surface -- `mode: compare`
# (two-sided, `old-library:` = the trusted base-commit baseline) and
# `abicheck compare -o json=PATH` -- see UPSTREAM_TO_ABICHECK.md's
# "2026-09-29: scan retirement" section for what did and did not carry
# over.  Converging onto `sha` (42da2d2f, 2026-08-24) was considered and
# rejected: it predates the scan removal, so it would not move the lab onto
# the supported surface -- and `sha` itself drives the native project path's
# reusable workflows + baseline generation, which is a separate reviewed
# bump.
#
# Baseline note: abi/*.abicheck.json were dumped by the previous pin.
# A local cross-version repro (b299afdc dump vs 5ba6a5c8 compare, clang
# frontend) is NOT clean -- it reports a spurious func_became_inline /
# public_not_exported on the implicit Calculator ctor that a same-version
# pair does not.  The first PR on this pin therefore compares a new-pin
# candidate against an old-pin baseline; baseline.yml regenerates the
# baseline at this pin on merge.
legacy_sha: 5ba6a5c84c07e504d4b1df8cbed0cf59abd5aa71

# Next candidate for canary certification.  Not installed by anything.
candidate_sha: f7b4fdcc7dafd73ea483b4522a3f63df3a74653f

# Workflows that legitimately track a moving ref instead of a pin, because
# their whole purpose is to find out what upstream main does before it is
# pinned.  Anything not listed here must use a pin above.
unpinned_by_design:
  - .github/workflows/scenarios-canary.yml
  - .github/workflows/canary.yml
