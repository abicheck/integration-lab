    pack, and committed baseline (abi/math.abicheck.json) stay keyed to `//:math` specifically.
    `scan_math_shared` builds and scans this target''s own genuinely different Bazel action
    graph (a real link action producing the shared object, not `cc_binary`''s own implicit
    link step) against its own committed baseline (abi/math_shared.abicheck.json, collected
    the same headers-depth way as strings.abicheck.json). Deliberately non-gating, same posture
