# Declarative capability matrix: which validation axis (evidence depth,
# header frontend, toolchain, target shape, comparison scope) this repo's
# CI actually exercises, which job/workflow exercises it, and whether that
# job gates a PR or only reports.
#
# Why this file exists: before it, "what does this lab actually cover" lived
# only as prose in README.md's "Known limitations / follow-ups" section --
# hand-typed, with nothing to stop it drifting from the real workflow jobs
# as those jobs were added/renamed/removed. scripts/check_capability_matrix.py
# is the machine check that keeps this file and .github/workflows/*.yml in
# agreement: every `status: covered`/`non_gating_watch` entry's `job`/
# `workflow` must actually exist, and every in-scope workflow job must be
# named by at least one entry -- so an added job with no matrix entry (or a
# matrix entry pointing at a renamed/removed job) fails CI instead of
# silently going stale.
#
# Scope, deliberately: only the jobs that answer "is a given ABI
# axis validated" are covered here -- abi-scan.yml, scenarios.yml,
# scenarios-canary.yml. baseline.yml (baseline *maintenance*, not
# validation) and performance.yml (perf trend measurement, not
# correctness) are out of scope by design, not an oversight -- neither
# answers a coverage question this matrix exists to track.
#
# Precedent this generalizes: scenarios/manifest.yaml already does the
# identical "declarative table + one script that checks reality against
# it" thing for detection-*correctness* scenarios specifically (fixture
# pair -> expected verdict). This file is the same pattern one level up:
# CI *coverage axis* -> which job exercises it, not fixture -> verdict.
#
# See scripts/check_capability_matrix.py --help and README.md's
# "Capability matrix" section for the phased plan this file is phase 1 of
# (schema + validator now; README generation from this file, a shared
# reusable-workflow leg, and dynamic matrix generation for
# toolchain_matrix-shaped jobs are later phases, not yet built).

dimensions:
  evidence_depth: [binary, headers, build, source, n/a]
  header_frontend: [castxml, clang, n/a]
  toolchain: [gcc-cxx17, gcc-cxx20, clang-cxx17, clang-cxx20, pinned-default, n/a]
  scope:
    [
      single_library,
      aggregate_multi_library,
      consumer_scoped,
      producer_agreement,
      detection_correctness,
      n/a,
    ]
  target_shape: [cc_binary_linkshared, cc_shared_library, n/a]

# status:
#   covered          -- a real job in an in-scope workflow exercises this
#                        axis today; `job`/`workflow` are required and
#                        checked against the real workflow file.
#   non_gating_watch  -- covered, but the job deliberately never fails a
#                        PR on its own (a property to observe, not a
#                        pass/fail contract) -- same meaning as `covered`
#                        for the validator, `gating` distinguishes them.
#   gap               -- known, not yet covered by any job. `job`/
#                        `workflow` must be absent (nothing to check).
#   planned           -- gap with a concrete follow-up already scoped
#                        (unused today; reserved so a future PR can
#                        distinguish "known, not yet started" from
#                        "known, actively being worked").

capabilities:
  - id: math-source-gate
    status: covered
    gating: true
    workflow: abi-scan.yml
    job: scan
    dimensions:
      evidence_depth: source
      header_frontend: castxml
      toolchain: pinned-default
      scope: single_library
      target_shape: cc_binary_linkshared
    note: >
      The required PR gate: full depth:source Bazel-evidence comparison of
      //:math against the committed baseline (abi/math.abicheck.json).

  - id: strings-headers-scan
    status: covered
    gating: false
    workflow: abi-scan.yml
    job: scan_strings
    dimensions:
      evidence_depth: headers
      # Codex review, PR #15: scan_strings explicitly sets
      # `ast-frontend: clang` (abi-scan.yml's scan_strings job) -- unlike
      # `scan`'s own canonical depth:source step, which leaves
      # --ast-frontend on abicheck's default (castxml). Verified directly
      # against the workflow file, not assumed from the sibling entry above.
      header_frontend: clang
      toolchain: pinned-default
      scope: single_library
      target_shape: cc_binary_linkshared
    note: >
      Best-effort depth:headers scan of strings_lib -- deliberately scoped
      down (no Bazel evidence pack, no depth:source replay); its job is
      exercising the aggregate plumbing below, not duplicating :math's own
      full pipeline. Never gates on its own.

  - id: aggregate-multi-library
    status: covered
    gating: true
    workflow: abi-scan.yml
    job: aggregate
    dimensions:
      evidence_depth: headers
      header_frontend: n/a
      toolchain: n/a
      scope: aggregate_multi_library
      target_shape: n/a
    note: >
      `abicheck aggregate` against a fail-closed expected-target manifest
      (math required whenever scan judged the PR ABI-relevant; strings
      discovered but not required). A missing required report is a real
      coverage-axis failure (exit 1), not absorbed into --discovered-only.

  - id: consumer-scoped-compare
    status: covered
    gating: false
    workflow: abi-scan.yml
    job: consumer_scoped
    dimensions:
      # Codex review, PR #15: the "ABICheck compare --used-by" step passes
      # new-header/ast-frontend: clang with none of depth:source's own
      # inputs (sources/build-info) -- a plain binary+header comparison,
      # same shape as scan_strings above, not the required gate's
      # depth:source pipeline. Verified directly against the workflow file.
      evidence_depth: headers
      header_frontend: clang
      toolchain: n/a
      scope: consumer_scoped
      target_shape: cc_binary_linkshared
    note: >
      `compare --used-by` against a real, historically-rebuilt consumer
      app (base-SHA libmath.so + base-SHA consumer_app, not a HEAD
      rebuild of both -- see README's "Consumer/app-scoped validation").
      Validates the app-scoping mechanism itself; not an additional gate.

  - id: toolchain-matrix-gcc-cxx17
    status: non_gating_watch
    gating: false
    workflow: abi-scan.yml
    job: toolchain_matrix
    dimensions:
      # Codex review, PR #15: the "ABICheck compare" step here passes
      # new-header/ast-frontend: clang with none of depth:source's own
      # inputs -- a plain binary+header comparison, not source-depth.
      # Verified directly against the workflow file.
      evidence_depth: headers
      header_frontend: clang
      toolchain: gcc-cxx17
      scope: single_library
      target_shape: cc_binary_linkshared
    note: >
      Rebuilds //:math under a {gcc,clang-18} x {c++17,c++20} combination
      and compares against the SAME committed baseline every other leg
      uses -- proves detection findings are actually toolchain-invariant
      rather than an artifact of the one fixed toolchain (.bazelrc's
      pinned default) the required gate always uses. Deliberately
      non-gating: this validates a property to watch, not a pass/fail
      contract :math's own ABI must additionally satisfy.

  - id: toolchain-matrix-gcc-cxx20
    status: non_gating_watch
    gating: false
    workflow: abi-scan.yml
    job: toolchain_matrix
    dimensions:
      # Codex review, PR #15: the "ABICheck compare" step here passes
      # new-header/ast-frontend: clang with none of depth:source's own
      # inputs -- a plain binary+header comparison, not source-depth.
      # Verified directly against the workflow file.
      evidence_depth: headers
      header_frontend: clang
      toolchain: gcc-cxx20
      scope: single_library
      target_shape: cc_binary_linkshared
    note: >
      Rebuilds //:math under a {gcc,clang-18} x {c++17,c++20} combination
      and compares against the SAME committed baseline every other leg
      uses -- proves detection findings are actually toolchain-invariant
      rather than an artifact of the one fixed toolchain (.bazelrc's
      pinned default) the required gate always uses. Deliberately
      non-gating: this validates a property to watch, not a pass/fail
      contract :math's own ABI must additionally satisfy.

  - id: toolchain-matrix-clang-cxx17
    status: non_gating_watch
    gating: false
    workflow: abi-scan.yml
    job: toolchain_matrix
    dimensions:
      # Codex review, PR #15: the "ABICheck compare" step here passes
      # new-header/ast-frontend: clang with none of depth:source's own
      # inputs -- a plain binary+header comparison, not source-depth.
      # Verified directly against the workflow file.
      evidence_depth: headers
      header_frontend: clang
      toolchain: clang-cxx17
      scope: single_library
      target_shape: cc_binary_linkshared
    note: >
      Rebuilds //:math under a {gcc,clang-18} x {c++17,c++20} combination
      and compares against the SAME committed baseline every other leg
      uses -- proves detection findings are actually toolchain-invariant
      rather than an artifact of the one fixed toolchain (.bazelrc's
      pinned default) the required gate always uses. Deliberately
      non-gating: this validates a property to watch, not a pass/fail
      contract :math's own ABI must additionally satisfy.

  - id: toolchain-matrix-clang-cxx20
    status: non_gating_watch
    gating: false
    workflow: abi-scan.yml
    job: toolchain_matrix
    dimensions:
      # Codex review, PR #15: the "ABICheck compare" step here passes
      # new-header/ast-frontend: clang with none of depth:source's own
      # inputs -- a plain binary+header comparison, not source-depth.
      # Verified directly against the workflow file.
      evidence_depth: headers
      header_frontend: clang
      toolchain: clang-cxx20
      scope: single_library
      target_shape: cc_binary_linkshared
    note: >
      Rebuilds //:math under a {gcc,clang-18} x {c++17,c++20} combination
      and compares against the SAME committed baseline every other leg
      uses -- proves detection findings are actually toolchain-invariant
      rather than an artifact of the one fixed toolchain (.bazelrc's
      pinned default) the required gate always uses. Deliberately
      non-gating: this validates a property to watch, not a pass/fail
      contract :math's own ABI must additionally satisfy.

  - id: l4-clang-plugin-evidence
    status: covered
    gating: false
    workflow: abi-scan.yml
    job: l4_clang_plugin
    dimensions:
      # Verified against abicheck/abicheck's own --depth resolution
      # (cli_compare_helpers._resolve_compare_collect_mode): this job's
      # compare step passes --build-info but no --sources and no explicit
      # --depth, which resolves to the "build" collect mode -- L3, not
      # the "source" (L4) depth its own job name suggests. The plugin
      # collects L4-shaped facts into the build-info pack (see README's
      # "Declared-output source-fact collection"), but this particular
      # compare invocation only asks abicheck to consume it at L3.
      evidence_depth: build
      header_frontend: clang
      toolchain: n/a
      scope: producer_agreement
      target_shape: cc_binary_linkshared
    note: >
      Best-effort L4 clang-plugin evidence collection, ABI-locked to the
      runner's exact LLVM major -- every step is continue-on-error and the
      job never fails on its own; a version mismatch degrades to a
      labeled "skipped" section rather than a real failure.

  - id: producer-agreement-report
    status: covered
    gating: false
    workflow: abi-scan.yml
    job: conformance
    dimensions:
      evidence_depth: n/a
      header_frontend: n/a
      toolchain: n/a
      scope: producer_agreement
      target_shape: n/a
    note: >
      Renders two informational conformance reports comparing sibling
      evidence producers pairwise: L2 castxml-vs-clang, and L4
      native-vs-clang-plugin (needs: [scan, l4_clang_plugin], if: always()
      -- degrades gracefully when either upstream job skipped). Never
      gates.

  # Codex review, PR #15: scenarios/manifest.yaml's own header comment is
  # explicit that every scenario below uses the `expected: {castxml: V,
  # clang: V}` profile-pair form specifically to regression-test that the
  # two header backends agree -- a single n/a-frontend entry silently
  # dropped that coverage. Split into one entry per profile, mirroring the
  # toolchain-matrix-* split above for the same reason (one job, several
  # independently-meaningful axis values). evidence_depth is `headers`,
  # not n/a either -- run_scenario.py's own docstring: "binary + header
  # depth only, deliberately not depth: source".
  - id: detection-correctness-scenarios-castxml
    status: covered
    gating: true
    workflow: scenarios.yml
    job: scenarios
    dimensions:
      evidence_depth: headers
      header_frontend: castxml
      toolchain: n/a
      scope: detection_correctness
      target_shape: n/a
    note: &detection-correctness-note >
      Independent fixture pairs (fixtures/, oracle in
      scenarios/manifest.yaml) with a machine-readable expected verdict
      per header-frontend profile -- proves abicheck actually detects a
      real break and leaves a compatible change alone, which the gate on
      :math's own diff can never prove on its own. A verdict mismatch
      fails the job (scripts/run_scenario.py exits non-zero).

  - id: detection-correctness-scenarios-clang
    status: covered
    gating: true
    workflow: scenarios.yml
    job: scenarios
    dimensions:
      evidence_depth: headers
      header_frontend: clang
      toolchain: n/a
      scope: detection_correctness
      target_shape: n/a
    note: *detection-correctness-note

  # Codex review, PR #15: scenarios-canary.yml runs the identical
  # scripts/run_scenario.py oracle as scenarios.yml (just against
  # abicheck/main instead of a pinned release), so it exercises the same
  # castxml/clang split -- split into two entries for the same reason as
  # detection-correctness-scenarios-* above, keeping gating: false.
  - id: scenarios-canary-castxml
    status: non_gating_watch
    gating: false
    workflow: scenarios-canary.yml
    job: scenarios_canary
    dimensions:
      evidence_depth: headers
      header_frontend: castxml
      toolchain: n/a
      scope: detection_correctness
      target_shape: n/a
    note: &scenarios-canary-note >
      Scheduled canary re-running the same scenario oracle against
      abicheck main, previewing not-yet-stable features (e.g.
      --contract-evaluation, ADR-049) before they land in a pinned
      release. Non-blocking by design.

  - id: scenarios-canary-clang
    status: non_gating_watch
    gating: false
    workflow: scenarios-canary.yml
    job: scenarios_canary
    dimensions:
      evidence_depth: headers
      header_frontend: clang
      toolchain: n/a
      scope: detection_correctness
      target_shape: n/a
    note: *scenarios-canary-note

  # Known gaps -- deliberately no job/workflow (there is none to check).
  - id: cc-shared-library-target-shape
    status: gap
    dimensions:
      evidence_depth: n/a
      header_frontend: n/a
      toolchain: n/a
      scope: n/a
      target_shape: cc_shared_library
    note: >
      README's "Known limitations": every fixture and the real :math
      target use cc_binary(linkshared = True); nothing exercises a
      genuine Bazel cc_shared_library target yet.

  - id: module-bazel-lock-pinning
    status: gap
    dimensions:
      evidence_depth: n/a
      header_frontend: n/a
      toolchain: n/a
      scope: n/a
      target_shape: n/a
    note: >
      README's "Known limitations": MODULE.bazel.lock (dependency
      pinning) is not part of any covered axis yet.
