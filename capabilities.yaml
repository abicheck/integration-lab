    header_frontend: castxml
    toolchain: pinned-default
    scope: single_library
    target_shape: cc_binary_linkshared
  note: 'The required PR gate: full depth:source Bazel-evidence comparison of //:math against
    the committed baseline (abi/math.abicheck.json).

    '
