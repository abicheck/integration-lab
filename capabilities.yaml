# Declarative capability matrix: which validation axis (evidence depth,
# header frontend, toolchain, target shape, comparison scope) this repo's
# CI actually exercises, which job/workflow exercises it, and whether that
# job gates a PR or only reports.
#
# Why this file exists: before it, "what does this lab actually cover" lived
# only as prose in README.md's "Known limitations / follow-ups" section --
# hand-typed, with nothing to stop it drifting from the real workflow jobs
# as those jobs were added/renamed/removed. scripts/check_capability_matrix.py
# is the machine check that keeps this file and .github/workflows/*.yml in
# agreement: every `status: covered`/`non_gating_watch` entry's `job`/
# `workflow` must actually exist, and every in-scope workflow job must be
# named by at least one entry -- so an added job with no matrix entry (or a
# matrix entry pointing at a renamed/removed job) fails CI instead of
# silently going stale.
#
# Scope, deliberately: only the jobs that answer "is a given ABI
# axis validated" are covered here -- abi-scan.yml, scenarios.yml,
# scenarios-canary.yml. baseline.yml (baseline *maintenance*, not
# validation) and performance.yml (perf trend measurement, not
# correctness) are out of scope by design, not an oversight -- neither
# answers a coverage question this matrix exists to track.
#
# Precedent this generalizes: scenarios/manifest.yaml already does the
# identical "declarative table + one script that checks reality against
# it" thing for detection-*correctness* scenarios specifically (fixture
# pair -> expected verdict). This file is the same pattern one level up:
# CI *coverage axis* -> which job exercises it, not fixture -> verdict.
#
# See scripts/check_capability_matrix.py --help and README.md's
# "Capability matrix" section for the phased plan this file started:
# phase 1 (schema + validator), phase 2 (scripts/gen_capability_gaps.py --
# README's own gap list generated from this file), and phase 4
# (scripts/check_toolchain_matrix_sync.py -- each toolchain_matrix entry's
# `matrix_leg` checked against abi-scan.yml's real strategy.matrix.include)
# are all built; phase 3 (a shared reusable-workflow leg replacing
# abi-scan.yml's duplicated job boilerplate) is partially done -- see
# README.md's "Capability matrix" section and
# .github/actions/skip-check|resolve-baseline for what's extracted and
# why the Bazel-cache-setup step deliberately isn't (yet).

dimensions:
  evidence_depth:
  - binary
  - headers
  - build
  - source
  - n/a
  header_frontend:
  - castxml
  - clang
  - n/a
  toolchain:
  - gcc-cxx17
  - gcc-cxx20
  - clang-cxx17
  - clang-cxx20
  - pinned-default
  - gcc14-cxx17
  - clang18-cxx17
  - multi-producer
  - n/a
  scope:
  - single_library
  - aggregate_multi_library
  - consumer_scoped
  - producer_agreement
  - detection_correctness
  - native_project
  - baseline_lifecycle
  - cross_dso
  - loader_runtime
  - python_extension
  - run_plan_semantics
  - evidence_portability
  - demonstration_oracle
  - n/a
  target_shape:
  - cc_binary_linkshared
  - cc_shared_library
  - native_project_topology
  - python_extension_module
  - elf_dso
  - n/a
capabilities:
