- id: module-bazel-lock-pinning
  status: covered
  gating: true
  workflow: abi-scan.yml
  job: scan
  dimensions:
    evidence_depth: n/a
    header_frontend: n/a
    toolchain: n/a
    scope: n/a
    target_shape: n/a
  note: 'Not a job-shaped axis like every other entry in this file -- `.bazelrc`''s `common
    --lockfile_mode=error` enforces MODULE.bazel.lock against every Bazel invocation in every
    job that runs one (build, query, cquery, aquery, mod), not just `scan`. Pointed at `scan`
    here (`gating: true`, since it''s this repo''s own required gate and the earliest Bazel
    invocation in the PR pipeline) as the representative job check_capability_matrix.py''s
    job/workflow model needs one entry to name; a lockfile-drift failure surfaces there first,
    on every PR, before any other job''s own build runs. `scan` emits a dedicated receipt
    for it (Codex review, fresh evidence: marking this `gating: true` with no receipt anywhere
    left a real gap in the one-receipt-per-gating-capability contract) derived from its own
    `lockfile_check` step -- a cheap `bazel query //:math` run before the real build, independent
    of whether the library build/scan themselves succeed, so lockfile drift reads distinctly
    from an ordinary scan failure. Verified directly: `bazel build //:math --lockfile_mode=error`
    fails closed with an explicit "run bazel mod deps --lockfile_mode=update" message on a
    deliberately mismatched MODULE.bazel (a downgraded rules_cc version not in the committed
    lock), and passes cleanly when MODULE.bazel and MODULE.bazel.lock agree.

    '
