# PR3 item 2 (design doc section 18): the build-recipe layer, decoupled
# from scenarios/manifest.yaml's own semantic layer (fixture pair ->
# expected verdict/suppression assertions). manifest.yaml stays the
# single source of truth for WHAT a scenario means and WHAT abicheck
# should conclude about it -- unchanged by this file, and still the only
# thing scripts/run_scenario.py reads for its existing, default
# --build-system bazel path (old_target/new_target/old_output/new_output
# there are themselves already a build recipe, just a bazel-only one that
# predates this file; not duplicated here, see below).
#
# This file adds ONLY the additional build systems' own recipes, keyed by
# scenario name -- when a build system has no entry for a scenario, that
# scenario simply isn't run under that build system yet (fails closed
# with a clear "no build mapping declared" message in
# scripts/run_scenario.py, never silently substituted or skipped
# quietly).
#
# `cmake` and `make` now both cover every scenario whose fixture has the
# shared `lib.cc` + `lib.h` shape the two generic recipes
# (buildsystems/cmake/fixtures/CMakeLists.txt and
# buildsystems/make/fixtures/Makefile) are parameterized over. That is the
# whole declared scenario suite except `generated_header_removed_function`,
# whose header is produced by its own Bazel genrule rather than committed
# to the fixture directory -- there is no lib.h for a FIXTURE_DIR recipe to
# compile against, so it stays bazel-only until the generation step itself
# is factored out of the Bazel rule. It fails closed as "no build mapping
# declared", never silently skipped.
#
# Parity, not just coverage: scripts/check_scenario_parity.py compares the
# reports these runs produce ACROSS build systems and fails unless the same
# semantic mutation yielded the same normalized findings and the same
# verdict everywhere it ran. Running a scenario under three build systems
# and checking each against its own oracle separately would pass even if
# the three disagreed with each other.
#
# `old_fixture_dir`/`new_fixture_dir` are repo-relative paths to a
# fixtures/<name>/{v1,v2}/ directory -- passed straight to
# buildsystems/cmake/fixtures/CMakeLists.txt's own -DFIXTURE_DIR. The
# built library's staged path is always <cmake-build-dir>/libimpl.so
# (that CMakeLists.txt's own fixed OUTPUT_NAME), matching the bazel
# path's own bazel-bin/.../libimpl.so naming convention -- so
# scripts/run_scenario.py's per-build-system code can share the same
# "run abicheck compare against libimpl.so" call regardless of which
# build system produced it.
#
# The header passed to `abicheck compare` for a cmake run is NOT
# duplicated here -- manifest.yaml's own new_header/old_header fields are
# repo source file paths (fixtures/<name>/v2/lib.h), not build outputs,
# so they're identical regardless of which build system compiled the
# library and are reused as-is by run_scenario.py for every build system.

schema_version: 1
build_systems:
  cmake: &id001
    add_function:
      old_fixture_dir: fixtures/add_function/v1
      new_fixture_dir: fixtures/add_function/v2
    change_signature:
      old_fixture_dir: fixtures/change_signature/v1
      new_fixture_dir: fixtures/change_signature/v2
    default_argument_added:
      old_fixture_dir: fixtures/default_argument_added/v1
      new_fixture_dir: fixtures/default_argument_added/v2
    remove_function:
      old_fixture_dir: fixtures/remove_function/v1
      new_fixture_dir: fixtures/remove_function/v2
    remove_function_suppressed:
      old_fixture_dir: fixtures/remove_function/v1
      new_fixture_dir: fixtures/remove_function/v2
    suppression_partial:
      old_fixture_dir: fixtures/suppression_partial/v1
      new_fixture_dir: fixtures/suppression_partial/v2
  make: *id001
