# Machine-readable oracle for scripts/run_scenario.py.
#
# Each scenario is a self-contained pair of tiny Bazel cc_binary
# (linkshared = True) targets under fixtures/<name>/{v1,v2}/, built
# independently of this lab's main //:math library -- so validating
# abicheck's detection semantics never touches (or risks breaking) the
# real gate this repo runs on itself in .github/workflows/abi-scan.yml.
#
# old_output/new_output follow the same Bazel cc_binary(linkshared=True)
# naming convention already verified elsewhere in this repo (target name
# "math" -> bazel-bin/libmath.so): each fixture's target is named "impl",
# so its output is bazel-bin/<package>/libimpl.so.
#
# A scenario declares its oracle one of two ways (scripts/run_scenario.py's
# `_scenario_profiles`):
#   expected_verdict: V              -- single run, abicheck's own default
#                                        header frontend (currently CastXML).
#   expected: {castxml: V, clang: V} -- one run per named profile, each with
#                                        --ast-frontend <profile> explicit.
#                                        Use this whenever a scenario should
#                                        also regression-test that the two
#                                        header backends agree (the l2-castxml
#                                        / l2-clang profile pair this repo's
#                                        abi-scan.yml runs against //:math
#                                        itself) -- every scenario below uses
#                                        this form, since none of these
#                                        changes has a reason to differ by
#                                        frontend, and a future divergence
#                                        would be a real cross-backend bug
#                                        worth catching here.
expected_gaps:
  - id: same-binary-clang-client-only-break
    status: expected_gap
    upstream_issue: "abicheck#consumer-compile-execution"
    expected_failure: {phase: check-project, reason: consumer_compile_not_applied}
  - id: per-check-runtime-environment
    status: expected_gap
    upstream_issue: "abicheck#per-cell-environment"
    expected_failure: {phase: project-plan, reason: environment_selector_not_supported}
  - id: pybind-cross-module-internals
    status: expected_gap
    upstream_issue: "abicheck#binding-abi-provider"
    expected_failure: {phase: compare, reason: binding_internals_identity_not_collected}
  - id: target-specific-source-evidence-routing
    status: expected_gap
    upstream_issue: "abicheck#run-plan-build-output-projection"
    expected_failure: {phase: check-project, reason: target_evidence_path_not_projected}

# Producer-compiler attribution.  Every other profile in this lab is a GCC
# 14 profile -- they vary by build system, not by the compiler that
# produces the ABI -- so nothing yet proves a finding is attributed to the
# producers it actually affects and withheld from the ones it does not.
# One fixture, one build system, two producer compilers; the change lives
# entirely in the fixture's non-Clang preprocessor branch.
producer_scenarios:
  - id: producer-compiler-word-width
    runner: ci/run_producer_compiler_scenario.py
    status: supported
    fixture: fixtures/producer_compiler
    producers:
      linux-x86_64-gcc14-cxx17-cmake-ninja:
        cxx: g++-14
        standard: c++17
      linux-x86_64-clang18-cxx17-cmake-ninja:
        cxx: clang++-18
        standard: c++17
    expect:
      # GCC sees int -> long long: _Z11lab_consumei is removed and
      # _Z11lab_consumex added, a real L0 break with no headers needed.
      affected_profiles:
        - linux-x86_64-gcc14-cxx17-cmake-ninja
      # Clang sees `long` on both sides: _Z11lab_consumel is unchanged.
      unaffected_profiles:
        - linux-x86_64-clang18-cxx17-cmake-ninja

# Emitted loader/runtime feature drift. One source (fixtures/loader_features/
# lib.c), linked twice per case with only linker/codegen flags differing, so
# a finding can only come from the feature the toolchain emitted.
#
# Deliberately NOT modelled as a minimum binutils version: binutils is a
# producer tool, and which binutils built an artifact is not what a loader
# sees. Each case names the ELF feature it emits, and every side declares
# what readelf must show before any comparison runs -- so a flag the
# toolchain silently ignored fails the scenario instead of producing two
# identical binaries, no findings, and a green result that tested nothing.
loader_scenarios:
- id: dt-relr-introduced
  description: Relative relocations folded into DT_RELR. A loader that does not understand DT_RELR cannot
    apply them at all.
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,-z,nopack-relative-relocs
    emits:
      absent:
      - (RELR)
  new:
    link:
    - -Wl,-z,pack-relative-relocs
    emits:
      present:
      - (RELR)
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: dt_relr_introduced
      symbol: DT_RELR
      severity: risk
- id: dt-relr-removed
  description: 'DT_RELR dropped again: readable by strictly more loaders, so a compatible direction --
    asserted so the pair cannot both read as risk.'
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,-z,pack-relative-relocs
    emits:
      present:
      - (RELR)
  new:
    link:
    - -Wl,-z,nopack-relative-relocs
    emits:
      absent:
      - (RELR)
  expect:
    verdict: COMPATIBLE
    findings:
    - kind: dt_relr_removed
      symbol: DT_RELR
      severity: compatible
- id: runpath-to-rpath
  description: 'DT_RUNPATH downgraded to DT_RPATH: RPATH is searched BEFORE LD_LIBRARY_PATH and is not
    overridable, so a consumer that relied on overriding the search path silently stops being able to.'
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,-rpath,/opt/lab
    - -Wl,--enable-new-dtags
    emits:
      present:
      - (RUNPATH)
      absent:
      - (RPATH)
  new:
    link:
    - -Wl,-rpath,/opt/lab
    - -Wl,--disable-new-dtags
    emits:
      present:
      - (RPATH)
      absent:
      - (RUNPATH)
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: rpath_type_changed
      symbol: DT_RPATH
      severity: risk
- id: rpath-to-runpath
  description: The reverse direction, which changes lookup order for every dependency and is therefore
    also a runtime risk, not a free upgrade.
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,-rpath,/opt/lab
    - -Wl,--disable-new-dtags
    emits:
      present:
      - (RPATH)
  new:
    link:
    - -Wl,-rpath,/opt/lab
    - -Wl,--enable-new-dtags
    emits:
      present:
      - (RUNPATH)
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: rpath_type_changed
      symbol: DT_RUNPATH
      severity: risk
- id: sysv-hash-removed
  description: The SysV .hash table dropped, leaving only .gnu.hash. Loaders and tools that read only
    the SysV table can no longer resolve symbols.
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,--hash-style=both
    emits:
      present:
      - (HASH)
      - (GNU_HASH)
  new:
    link:
    - -Wl,--hash-style=gnu
    emits:
      present:
      - (GNU_HASH)
      absent:
      - '(HASH)  '
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: hash_style_removed
      symbol: .hash
      severity: risk
- id: soname-major-change
  description: 'SONAME major bump with no actual ABI change: every existing consumer must relink, and
    the bump is not justified by the surface.'
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,-soname,liblab.so.1
    emits:
      present:
      - liblab.so.1
  new:
    link:
    - -Wl,-soname,liblab.so.2
    emits:
      present:
      - liblab.so.2
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: soname_changed
      symbol: DT_SONAME
      severity: risk
    - kind: soname_bump_unnecessary
      symbol: DT_SONAME
      severity: compatible
- id: symbol-version-node-added
  description: 'A new version node appears alongside the existing one: additive, so already-linked consumers
    keep resolving against the old node.'
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,--version-script={fixture}/one-node.map
    emits:
      present:
      - 'Name: LAB_1.0'
      absent:
      - 'Name: LAB_2.0'
  new:
    link:
    - -Wl,--version-script={fixture}/two-nodes.map
    emits:
      present:
      - 'Name: LAB_1.0'
      - 'Name: LAB_2.0'
  expect:
    verdict: COMPATIBLE
    findings:
    - kind: symbol_version_defined_added
      symbol: LAB_2.0
      severity: compatible
- id: symbol-version-node-removed
  description: 'A version node disappears: every consumer that bound to it fails to resolve at load time.
    The breaking direction of the pair above.'
  fixture: fixtures/loader_features
  old:
    link:
    - -Wl,--version-script={fixture}/two-nodes.map
    emits:
      present:
      - 'Name: LAB_2.0'
  new:
    link:
    - -Wl,--version-script={fixture}/one-node.map
    emits:
      absent:
      - 'Name: LAB_2.0'
  expect:
    verdict: BREAKING
    findings:
    - kind: symbol_version_node_removed
      symbol: LAB_2.0
      severity: breaking
- id: cet-protection-weakened
  description: IBT/SHSTK dropped from .note.gnu.property. A process that enforces CET loses that enforcement
    as soon as this object is mapped in.
  fixture: fixtures/loader_features
  old:
    link:
    - -fcf-protection=full
    - -Wl,-z,ibt
    - -Wl,-z,shstk
    emits:
      present:
      - IBT
      - SHSTK
  new:
    link:
    - -fcf-protection=none
    emits:
      absent:
      - 'x86 feature: IBT'
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: cet_protection_weakened
      symbol: .note.gnu.property
      severity: risk
- id: cet-protection-improved
  description: The strengthening direction, asserted so a scanner that reported the same severity in both
    directions would fail here.
  fixture: fixtures/loader_features
  old:
    link:
    - -fcf-protection=none
    emits:
      absent:
      - 'x86 feature: IBT'
  new:
    link:
    - -fcf-protection=full
    - -Wl,-z,ibt
    - -Wl,-z,shstk
    emits:
      present:
      - IBT
      - SHSTK
  expect:
    verdict: COMPATIBLE
    findings:
    - kind: cet_protection_improved
      symbol: .note.gnu.property
      severity: compatible
- id: static-tls-introduced
  description: 'DF_STATIC_TLS appears: the object now demands a static TLS block, so it can fail to dlopen
    once the process''s surplus static TLS is spent.'
  fixture: fixtures/loader_features
  old:
    link:
    - -ftls-model=global-dynamic
    emits:
      absent:
      - STATIC_TLS
  new:
    link:
    - -ftls-model=initial-exec
    emits:
      present:
      - STATIC_TLS
  expect:
    verdict: COMPATIBLE_WITH_RISK
    findings:
    - kind: static_tls_introduced
      symbol: DF_STATIC_TLS
      severity: risk

# Wheel-level comparison: old.whl against new.whl, not a standalone .so.
# python_scenarios (below) recompiles a bare _core.so and compares adjacent
# .pyi files -- a sound unit-level acceptance case that stays as one, but it
# never exercises the packaging layer, so it would not notice a missing
# extension, an unpackaged stub, an added/removed extension, or wheel tags
# that stopped matching the interpreter. This does.
wheel_scenarios:
- id: wheel-package-level
  runner: ci/run_python_wheel_scenario.py
  status: supported
  package: bindings/python
  stubs: bindings/python/scenarios/keyword-renamed
  old_stub: v1.pyi
  new_stub: v2.pyi
  identity:
    require_stubs: true
    packaged_under:
    - abicheck_lab_py/
  cases:
  - id: stub-api-break-inside-the-package
    old: old
    new: new
    expect:
      verdict: API_BREAK
      findings:
      - kind: python_api_parameter_renamed
        symbol: python:_core.transform
      - kind: python_api_default_removed
        symbol: python:_core.transform
      unmatched_old: []
      unmatched_new: []
      bundle_verdict: NO_CHANGE
      bundle_accounting_findings: []
  - id: extension-added-to-the-package
    old: old
    new: old_plus_extension
    # Compiled for this interpreter with the matching PyInit__extra and
    # import-checked before it is packed, so this exercises accounting for a
    # real extension rather than for a renamed byte copy of _core (which
    # still exports PyInit__core and cannot be imported at all).
    added_module: _extra
    expect:
      findings: []
      changed_libraries: []
      unmatched_old: []
      # Declared by module stem, not filename: the ABI tag in an extension
      # filename is whatever interpreter the runner has, and a filename-level
      # expectation would pin this scenario to one Python version.
      unmatched_new:
      - _extra
      # Package-level accounting only. No `verdict`/`bundle_verdict` is
      # declared here on purpose: a genuinely loadable second module links
      # CPython, so the bundle's dependency-closure findings (and the
      # verdict they drive) are a property of the interpreter it was built
      # against, not of the addition being noticed. Those findings are
      # recorded in the receipt instead of pinned.
      bundle_accounting_findings:
      - kind: bundle_library_added
        symbol: _extra

depth_scenarios:
  - id: l2-green-l4-macro-break
    runner: ci/run_depth_scenario.py
    status: supported
    fixture: fixtures/l2_l4_macro
    expect:
      headers:
        verdict: NO_CHANGE
        # Dump-side. This is the half that detects a depth fallback.
        effective_depth: headers
        findings: []
        # Compare-side. `status: partial` is honest, not a concession: for
        # this fixture --scope-public-headers cannot resolve a public
        # surface and falls back to the full export table. That channel is
        # orthogonal to depth, and pinning the real value here means a
        # change in it fails the scenario instead of being absorbed.
        compare_assurance:
          status: partial
          fact_set_comparability: not_applicable
          l3_context_status: not_evaluated
      source:
        verdict: API_BREAK
        effective_depth: source
        findings:
          - {kind: public_macro_value_changed, symbol: LAB_MAX_ITEMS}
        # The source stage has no such excuse: `complete`, plus the two
        # fields that prove L3/L4 evidence was actually used in the
        # comparison rather than it quietly running on L0/L2 alone.
        compare_assurance:
          status: complete
          fact_set_comparability: comparable
          l3_context_status: clean

runtime_scenarios:
  - id: runtime-floor-raised
    runner: ci/run_runtime_floor_scenario.py
    status: supported
    fixture: fixtures/runtime_floor
    expect:
      no_matrix: {verdict: COMPATIBLE_WITH_RISK, floor_severity: risk}
      labrt_1: {verdict: BREAKING, floor_severity: breaking}
      # The floor itself is compatible on LABRT 2.0. The aggregate remains
      # risk because the candidate also starts importing a new function.
      labrt_2: {verdict: COMPATIBLE_WITH_RISK, floor_severity: compatible}

python_scenarios:
  - id: pybind-keyword-renamed
    runner: ci/run_python_extension_scenario.py
    status: supported
    source: bindings/python/src/module.cpp
    stubs: bindings/python/scenarios/keyword-renamed
    expect:
      verdict: API_BREAK
      binary_identical: true
      findings:
        - {kind: python_api_parameter_renamed, symbol: "python:_core.transform"}
        - {kind: python_api_default_removed, symbol: "python:_core.transform"}

project_scenarios:
  - id: project-cross-dso-break
    runner: ci/run_project_bundle_scenario.py
    status: supported
    fixture: fixtures/project_cross_dso
    expect:
      verdict: BREAKING
      bundle_finding:
        kind: bundle_intra_dep_signature_changed
        symbol: core_scale
        provider_library: libcore.so
        consumer_library: libmath.so

scenarios:
  - name: add_function
    description: >
      v2 adds a new exported function alongside the existing one. Purely
      additive -- existing callers of the untouched function are
      unaffected, so this must read as compatible.
    old_target: "//fixtures/add_function/v1:impl"
    new_target: "//fixtures/add_function/v2:impl"
    old_output: bazel-bin/fixtures/add_function/v1/libimpl.so
    new_output: bazel-bin/fixtures/add_function/v2/libimpl.so
    new_header: fixtures/add_function/v2/lib.h
    expected:
      castxml: COMPATIBLE
      clang: COMPATIBLE

  - name: remove_function
    description: >
      v2 removes an exported function present in v1. Any binary already
      linked against v1's .so and calling the removed symbol fails to
      resolve it against v2 -- a binary ABI break.
    old_target: "//fixtures/remove_function/v1:impl"
    new_target: "//fixtures/remove_function/v2:impl"
    old_output: bazel-bin/fixtures/remove_function/v1/libimpl.so
    new_output: bazel-bin/fixtures/remove_function/v2/libimpl.so
    new_header: fixtures/remove_function/v2/lib.h
    expected:
      castxml: BREAKING
      clang: BREAKING

  - name: remove_function_suppressed
    description: >
      Same fixture pair as remove_function (v2 removes an exported
      function), but with suppressions/remove_function_accepted.yaml
      applied -- an exact-symbol rule matching exactly the one removed
      export (scenario::removed_function(int), func_removed), not a broad
      namespace/pattern selector, so no allow_public_break is needed
      (AGENTS.md's own suppression guidance: a narrow, exact-symbol rule is
      already an explicit, audited decision).
      This is the review's suppression scenario #1 ("only a known finding
      is present"): the same real ABI break that reads BREAKING unsuppressed
      must read NO_CHANGE once suppressed -- and, critically, the report's
      own suppression audit trail (suppression.suppressed_count) must show
      exactly 1, proving the finding was suppressed rather than never
      detected in the first place. Verified locally against a real
      clang-compiled fixture pair: unsuppressed BREAKING,
      suppressed NO_CHANGE with suppressed_count: 1.
    old_target: "//fixtures/remove_function/v1:impl"
    new_target: "//fixtures/remove_function/v2:impl"
    old_output: bazel-bin/fixtures/remove_function/v1/libimpl.so
    new_output: bazel-bin/fixtures/remove_function/v2/libimpl.so
    # old_header (unlike plain remove_function, which needs neither side's
    # header -- the removal is mangled-symbol-visible alone): empirically
    # required for --suppress's exact-symbol matching to actually apply
    # (verified locally against the exact pinned abicheck commit CI uses --
    # omitting it left suppressed_count: 0 despite an exact mangled-symbol
    # match, apparently because the old side's public-surface/reachability
    # classification -- which suppression matching consults -- stays
    # unresolved without any header-derived facts for that side at all).
    old_header: fixtures/remove_function/v1/lib.h
    new_header: fixtures/remove_function/v2/lib.h
    suppress: suppressions/remove_function_accepted.yaml
    expected_suppressed_count: 1
    # Codex review: count alone doesn't prove WHICH finding was
    # suppressed -- pin the actual symbol identity too.
    expected_suppressed_symbols:
      - _ZN8scenario16removed_functionEi
    # Nothing should remain gating -- the ONE finding was the accepted
    # removal itself, now fully suppressed.
    expected_gating_symbols: []
    expected:
      castxml: NO_CHANGE
      clang: NO_CHANGE

  - name: suppression_partial
    description: >
      v2 both removes legacy_metric AND changes required_api's parameter
      type (int -> long) -- two independent breaking findings.
      suppressions/legacy_metric_removed.yaml suppresses only the first
      (an exact-symbol rule, scoped to legacy_metric alone). This is the
      review's suppression scenario #2 ("known finding plus a new break",
      called out as the central case: old accepted noise must stop
      gating, but ANY new incompatible change must still be caught). The
      gate must stay BREAKING overall (required_api's change is real and
      unsuppressed) while suppression.suppressed_count still shows exactly
      1 -- proving the suppression rule is correctly scoped, not
      accidentally silencing more than it should. Verified locally
      against a real clang-compiled fixture pair.
    old_target: "//fixtures/suppression_partial/v1:impl"
    new_target: "//fixtures/suppression_partial/v2:impl"
    old_output: bazel-bin/fixtures/suppression_partial/v1/libimpl.so
    new_output: bazel-bin/fixtures/suppression_partial/v2/libimpl.so
    # old_header: same reason as remove_function_suppressed above --
    # --suppress's exact-symbol matching needs old-side header-derived
    # facts to actually apply.
    old_header: fixtures/suppression_partial/v1/lib.h
    new_header: fixtures/suppression_partial/v2/lib.h
    suppress: suppressions/legacy_metric_removed.yaml
    expected_suppressed_count: 1
    # Codex review: without pinning identity, this scenario passes just as
    # easily if the suppression rule accidentally matched required_api's
    # change instead of legacy_metric's (leaving legacy_metric unsuppressed)
    # -- same verdict, same count, wrong reason. Pin both: which symbol was
    # suppressed, and which symbol is still the (only) gating finding.
    expected_suppressed_symbols:
      - _ZN8scenario13legacy_metricEi
    # required_api's own signature change surfaces as an old-symbol
    # removal + new-symbol addition pair (verified locally): the mangled
    # name itself changes (int -> long), so this is func_removed(old) +
    # func_added(new), not a single "changed" kind.
    expected_gating_symbols:
      - _ZN8scenario12required_apiEi
      - _ZN8scenario12required_apiEl
    expected:
      castxml: BREAKING
      clang: BREAKING

  - name: default_argument_added
    description: >
      v2 gives an existing parameter a default value. The mangled symbol is
      unchanged (default arguments aren't part of Itanium mangling) -- and,
      verified directly against abicheck's own source
      (abicheck/checker_policy.py's ChangeKind docstrings,
      abicheck/diff_symbols.py's default-argument detector), this is
      deliberately, intentionally never flagged at all: gaining a default is
      purely additive (an existing caller that already passes the argument
      is unaffected; only NEW code gets the option to omit it), unlike
      PARAM_DEFAULT_VALUE_REMOVED/PARAM_DEFAULT_VALUE_CHANGED, which do gate
      as API_BREAK because they take a capability away from an existing
      caller. Since it produces literally zero `Change` entries (not merely
      zero *gating* ones), the actual verdict abicheck emits is the more
      specific NO_CHANGE, not COMPATIBLE (COMPATIBLE is reserved for a diff
      with real, non-gating changes -- e.g. add_function's added function;
      NO_CHANGE is for a diff with none at all -- verified against a real
      report from this exact scenario: "changes": []). Regression scenario
      pinning both facts; earlier revisions of this scenario incorrectly
      expected API_BREAK, then COMPATIBLE -- see this PR's own CI history
      and review discussion for the corrections and the source citations
      backing them.
    old_target: "//fixtures/default_argument_added/v1:impl"
    new_target: "//fixtures/default_argument_added/v2:impl"
    old_output: bazel-bin/fixtures/default_argument_added/v1/libimpl.so
    new_output: bazel-bin/fixtures/default_argument_added/v2/libimpl.so
    old_header: fixtures/default_argument_added/v1/lib.h
    new_header: fixtures/default_argument_added/v2/lib.h
    expected:
      castxml: NO_CHANGE
      clang: NO_CHANGE

  - name: change_signature
    description: >
      v2 changes an exported function's parameter type (int -> long).
      C++ name mangling encodes parameter types, so this is the old
      mangled symbol disappearing plus a new one appearing -- breaking
      for any caller compiled against v1's signature.
    old_target: "//fixtures/change_signature/v1:impl"
    new_target: "//fixtures/change_signature/v2:impl"
    old_output: bazel-bin/fixtures/change_signature/v1/libimpl.so
    new_output: bazel-bin/fixtures/change_signature/v2/libimpl.so
    new_header: fixtures/change_signature/v2/lib.h
    expected:
      castxml: BREAKING
      clang: BREAKING

  - name: generated_header_removed_function
    description: >
      Architecture review P1-4 ("generated headers" gap): unlike every
      other fixture pair, v1/v2's `lib.h` is NOT a checked-in source file
      -- a Bazel `genrule` (fixtures/generated_header/gen_header.py)
      produces it at build time from a plain list of function names, so
      the header abicheck reads via `--header new=...` is itself a build
      output under bazel-bin/, not a source-tree path. v2's generator
      invocation drops "removed_function" from the declared list (and
      lib.cc correspondingly no longer defines it) -- the same shape as
      remove_function, but proving the whole pipeline (Bazel genrule ->
      generated header -> abicheck header ingestion -> detection) works
