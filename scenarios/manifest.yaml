# Machine-readable oracle for scripts/run_scenario.py.
#
# Each scenario is a self-contained pair of tiny Bazel cc_binary
# (linkshared = True) targets under fixtures/<name>/{v1,v2}/, built
# independently of this lab's main //:math library -- so validating
# abicheck's detection semantics never touches (or risks breaking) the
# real gate this repo runs on itself in .github/workflows/abi-scan.yml.
#
# old_output/new_output follow the same Bazel cc_binary(linkshared=True)
# naming convention already verified elsewhere in this repo (target name
# "math" -> bazel-bin/libmath.so): each fixture's target is named "impl",
# so its output is bazel-bin/<package>/libimpl.so.
#
# A scenario declares its oracle one of two ways (scripts/run_scenario.py's
# `_scenario_profiles`):
#   expected_verdict: V              -- single run, abicheck's own default
#                                        header frontend (currently CastXML).
#   expected: {castxml: V, clang: V} -- one run per named profile, each with
#                                        --ast-frontend <profile> explicit.
#                                        Use this whenever a scenario should
#                                        also regression-test that the two
#                                        header backends agree (the l2-castxml
#                                        / l2-clang profile pair this repo's
#                                        abi-scan.yml runs against //:math
#                                        itself) -- every scenario below uses
#                                        this form, since none of these
#                                        changes has a reason to differ by
#                                        frontend, and a future divergence
#                                        would be a real cross-backend bug
#                                        worth catching here.
scenarios:
  - name: add_function
    description: >
      v2 adds a new exported function alongside the existing one. Purely
      additive -- existing callers of the untouched function are
      unaffected, so this must read as compatible.
    old_target: "//fixtures/add_function/v1:impl"
    new_target: "//fixtures/add_function/v2:impl"
    old_output: bazel-bin/fixtures/add_function/v1/libimpl.so
    new_output: bazel-bin/fixtures/add_function/v2/libimpl.so
    new_header: fixtures/add_function/v2/lib.h
    expected:
      castxml: COMPATIBLE
      clang: COMPATIBLE

  - name: remove_function
    description: >
      v2 removes an exported function present in v1. Any binary already
      linked against v1's .so and calling the removed symbol fails to
      resolve it against v2 -- a binary ABI break.
    old_target: "//fixtures/remove_function/v1:impl"
    new_target: "//fixtures/remove_function/v2:impl"
    old_output: bazel-bin/fixtures/remove_function/v1/libimpl.so
    new_output: bazel-bin/fixtures/remove_function/v2/libimpl.so
    new_header: fixtures/remove_function/v2/lib.h
    expected:
      castxml: BREAKING
      clang: BREAKING

  - name: remove_function_suppressed
    description: >
      Same fixture pair as remove_function (v2 removes an exported
      function), but with suppressions/remove_function_accepted.yaml
      applied -- an exact-symbol rule matching exactly the one removed
      export (scenario::removed_function(int), func_removed), not a broad
      namespace/pattern selector, so no allow_public_break is needed
      (AGENTS.md's own suppression guidance: a narrow, exact-symbol rule is
      already an explicit, audited decision).
      This is the review's suppression scenario #1 ("only a known finding
      is present"): the same real ABI break that reads BREAKING unsuppressed
      must read NO_CHANGE once suppressed -- and, critically, the report's
      own suppression audit trail (suppression.suppressed_count) must show
      exactly 1, proving the finding was suppressed rather than never
      detected in the first place. Verified locally against a real
      clang-compiled fixture pair: unsuppressed BREAKING,
      suppressed NO_CHANGE with suppressed_count: 1.
    old_target: "//fixtures/remove_function/v1:impl"
    new_target: "//fixtures/remove_function/v2:impl"
    old_output: bazel-bin/fixtures/remove_function/v1/libimpl.so
    new_output: bazel-bin/fixtures/remove_function/v2/libimpl.so
    new_header: fixtures/remove_function/v2/lib.h
    suppress: suppressions/remove_function_accepted.yaml
    expected_suppressed_count: 1
    expected:
      castxml: NO_CHANGE
      clang: NO_CHANGE

  - name: suppression_partial
    description: >
      v2 both removes legacy_metric AND changes required_api's parameter
      type (int -> long) -- two independent breaking findings.
      suppressions/legacy_metric_removed.yaml suppresses only the first
      (an exact-symbol rule, scoped to legacy_metric alone). This is the
      review's suppression scenario #2 ("known finding plus a new break",
      called out as the central case: old accepted noise must stop
      gating, but ANY new incompatible change must still be caught). The
      gate must stay BREAKING overall (required_api's change is real and
      unsuppressed) while suppression.suppressed_count still shows exactly
      1 -- proving the suppression rule is correctly scoped, not
      accidentally silencing more than it should. Verified locally
      against a real clang-compiled fixture pair.
    old_target: "//fixtures/suppression_partial/v1:impl"
    new_target: "//fixtures/suppression_partial/v2:impl"
    old_output: bazel-bin/fixtures/suppression_partial/v1/libimpl.so
    new_output: bazel-bin/fixtures/suppression_partial/v2/libimpl.so
    new_header: fixtures/suppression_partial/v2/lib.h
    suppress: suppressions/legacy_metric_removed.yaml
    expected_suppressed_count: 1
    expected:
      castxml: BREAKING
      clang: BREAKING

  - name: default_argument_added
    description: >
      v2 gives an existing parameter a default value. The mangled symbol is
      unchanged (default arguments aren't part of Itanium mangling) -- and,
      verified directly against abicheck's own source
      (abicheck/checker_policy.py's ChangeKind docstrings,
      abicheck/diff_symbols.py's default-argument detector), this is
      deliberately, intentionally never flagged at all: gaining a default is
      purely additive (an existing caller that already passes the argument
      is unaffected; only NEW code gets the option to omit it), unlike
      PARAM_DEFAULT_VALUE_REMOVED/PARAM_DEFAULT_VALUE_CHANGED, which do gate
      as API_BREAK because they take a capability away from an existing
      caller. Since it produces literally zero `Change` entries (not merely
      zero *gating* ones), the actual verdict abicheck emits is the more
      specific NO_CHANGE, not COMPATIBLE (COMPATIBLE is reserved for a diff
      with real, non-gating changes -- e.g. add_function's added function;
      NO_CHANGE is for a diff with none at all -- verified against a real
      report from this exact scenario: "changes": []). Regression scenario
      pinning both facts; earlier revisions of this scenario incorrectly
      expected API_BREAK, then COMPATIBLE -- see this PR's own CI history
      and review discussion for the corrections and the source citations
      backing them.
    old_target: "//fixtures/default_argument_added/v1:impl"
    new_target: "//fixtures/default_argument_added/v2:impl"
    old_output: bazel-bin/fixtures/default_argument_added/v1/libimpl.so
    new_output: bazel-bin/fixtures/default_argument_added/v2/libimpl.so
    old_header: fixtures/default_argument_added/v1/lib.h
    new_header: fixtures/default_argument_added/v2/lib.h
    expected:
      castxml: NO_CHANGE
      clang: NO_CHANGE

  - name: change_signature
    description: >
      v2 changes an exported function's parameter type (int -> long).
      C++ name mangling encodes parameter types, so this is the old
      mangled symbol disappearing plus a new one appearing -- breaking
      for any caller compiled against v1's signature.
    old_target: "//fixtures/change_signature/v1:impl"
    new_target: "//fixtures/change_signature/v2:impl"
    old_output: bazel-bin/fixtures/change_signature/v1/libimpl.so
    new_output: bazel-bin/fixtures/change_signature/v2/libimpl.so
    new_header: fixtures/change_signature/v2/lib.h
    expected:
      castxml: BREAKING
      clang: BREAKING
